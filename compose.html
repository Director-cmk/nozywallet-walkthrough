<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NozyWallet Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; background: #0c0b09; }
  canvas { display: block; width: 100vw; height: auto; max-width: calc(100vh * 9 / 16); margin: 0 auto; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
// Nozy brand: Ink / Paper / Silver, Syne + Outfit. ZecHub mark as the producer credit.
const K = { ink: '#0c0b09', paper: '#f5f0e6', silver: '#c8ccd4', dim: 'rgba(200,204,212,.55)' };
const DISPLAY = 'Syne, "Segoe UI", sans-serif', BODY = 'Outfit, "Segoe UI", sans-serif';
const W = 1080, H = 1920;
const SCREEN = { x: 90, y: 168, w: 900, h: 1600 };        // where the recording sits
const SRC = { w: 1080, h: 1920 };                           // recording px (events are in the same space)

// ZecHub mark (official ZecHubWhite.svg, viewBox 1080)
const LOGO = [
  'M539.5,80.35c-253.15,0-459.09,205.94-459.09,459.08s205.94,459.08,459.09,459.08,459.09-205.94,459.09-459.08S792.63,80.35,539.5,80.35ZM120.37,539.43c0-153.84,83.33-288.57,207.21-361.47v151.21h76l-75.46,148.04v34.75h83.9v134.23h-36.63v-77.77h-47.81v332.48c-123.88-72.91-207.21-207.63-207.21-361.47ZM539.5,958.56c-58.22,0-113.69-11.94-164.12-33.48v-239.7l36.63-.3v100.89h47.81v-281.68h-.54v-27.08h-75.02l75.02-148.04v-34.75h-90.51v-137.74c52.17-23.36,109.96-36.38,170.72-36.38,231.12,0,419.14,188.02,419.14,419.13s-188.02,419.13-419.14,419.13Z',
  'M556.8,751.21h-35.8v-182.79h-48.22v187.69c0,9.49,3.41,16.84,10.24,22.04,6.83,5.21,16.38,7.81,28.66,7.81h54.02c12.42,0,22.07-2.6,28.97-7.81,6.9-5.21,10.35-12.55,10.35-22.04v-187.69h-48.22v182.79Z',
  'M740.31,576.23c-6.9-5.2-16.55-7.81-28.97-7.81h-92.93v217.55h88.99c14.62,0,25.49-2.47,32.59-7.42,7.1-4.95,10.66-12.53,10.66-22.73v-85.58h-20.7c7.17-1.84,12.42-4.85,15.73-9.03,3.31-4.19,4.97-9.95,4.97-17.3v-45.77c0-9.39-3.45-16.69-10.35-21.890ZM704.1,752.13h-39.12v-70.12l39.12.16v69.96ZM704.1,645.89l-39.12-.46v-43.48h39.12v43.94Z',
  'M472.43,511.96L605.02,511.96L605.02,477.21L520.94,477.17L520.94,424.57L565.57,424.57L565.57,385.32L520.94,385.32L520.94,329.13L605.02,329.17L605.02,294.41L472.43,294.41L472.43,511.96Z',
  'M740.35,302.22c-7.39-5.2-17.66-7.81-30.82-7.81h-50.97c-13.02,0-23.14,2.6-30.38,7.81-7.24,5.21-10.86,12.51-10.86,21.89v157.99c0,9.49,3.62,16.84,10.86,22.04,7.24,5.21,17.36,7.81,30.38,7.81h50.97c13.31,0,23.62-2.6,30.93-7.81,7.31-5.21,10.97-12.55,10.97-22.04v-40.27h-51.77v35.68h-31.23v-148.65h31.23v27.51h51.77v-32.26c0-9.39-3.7-16.69-11.08-21.89Z',
].map(d => new Path2D(d));

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, k) => a + (b - a) * k;

function text(str, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.fillStyle = o.color ?? K.paper;
  ctx.font = `${o.weight ?? 600} ${o.size ?? 40}px ${o.font ?? BODY}`;
  ctx.textAlign = o.align ?? 'left';
  if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
  ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function logo(x, y, size, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x - size / 2, y - size / 2); ctx.scale(size / 1080, size / 1080);
  ctx.fillStyle = K.paper; for (const p of LOGO) ctx.fill(p); ctx.restore();
}

// ---------------------------------------------------------------------------
// Timeline data is injected by render-walk.mjs as window.PLAN:
//   { segments: [{id, step, say, start, dur, speechStart, speechDur, phase, a, b}], frames: {A:[ms...]}, events: {A:[...]}, total }
// ---------------------------------------------------------------------------
const imgCache = new Map();
function loadImg(url) {
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  imgCache.set(url, p);
  if (imgCache.size > 120) imgCache.delete(imgCache.keys().next().value);
  return p;
}
function frameAt(phase, ms) {
  const arr = PLAN.frames[phase];
  let lo = 0, hi = arr.length - 1;
  if (ms <= arr[0]) return arr[0];
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (arr[mid] <= ms) lo = mid; else hi = mid - 1; }
  return arr[lo];
}
const segAt = t => PLAN.segments.find(s => t >= s.start && t < s.start + s.dur) || PLAN.segments[PLAN.segments.length - 1];
const srcTime = (s, t) => s.a + (s.b - s.a) * clamp((t - s.start) / s.dur);
const outTime = (s, ms) => s.start + (ms - s.a) / (s.b - s.a) * s.dur;

// Camera: zoom toward the field being typed in, or toward a logged zoom target.
function camera(s, ms) {
  const ev = PLAN.events[s.phase];
  let target = null;
  for (const e of ev) {
    if (e.t > ms) break;
    if (e.type === 'typing') target = { rect: e.rect, z: 1, from: e.t, until: Infinity }; // Nozy inputs are full-width; zooming would crop labels
    else if (e.type === 'zoom') target = { rect: e.rect, z: 1, from: e.t, until: e.t + 3500 };
    else if ((e.type === 'tap' || e.type === 'mark') && target && e.t > target.from) target.until = Math.min(target.until, e.t);
  }
  if (target && ms > target.until + 600) target = null;
  const out = target && Number.isFinite(target.until) ? ease(seg(ms, target.until, target.until + 600)) : 0;
  const k = target ? ease(seg(ms, target.from, target.from + 600)) * (1 - out) : 0;
  const cx = target ? target.rect.x + target.rect.w / 2 : 540, cy = target ? target.rect.y + target.rect.h / 2 : 960;
  return { z: lerp(1, target?.z ?? 1, k), cx: lerp(540, cx, k), cy: lerp(960, cy, k) };
}
// Map a CSS-px point in the recording to output canvas coordinates under a camera.
function mapPt(cam, x, y) {
  const sx = SCREEN.w / SRC.w, sy = SCREEN.h / SRC.h;
  const vx = (x - cam.cx) * cam.z + 540, vy = (y - cam.cy) * cam.z + 960;
  return [SCREEN.x + vx * sx, SCREEN.y + vy * sy];
}

async function drawScreen(s, t) {
  const ms = srcTime(s, t);
  // never show a frame captured before this segment's source range
  let fms = frameAt(s.phase, ms);
  if (fms < s.a) fms = PLAN.frames[s.phase].find(f => f >= s.a) ?? fms;
  const img = await loadImg(`rec/${s.phase}/f-${String(fms).padStart(7, '0')}.jpg`);
  let cam = camera(s, ms);
  // keep the zoomed view inside the recording
  const halfW = 540 / cam.z, halfH = 960 / cam.z;
  cam.cx = clamp(cam.cx, halfW, SRC.w - halfW); cam.cy = clamp(cam.cy, halfH, SRC.h - halfH);

  ctx.save();
  rr(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h, 34); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
  const sw = SRC.w / cam.z, sh = SRC.h / cam.z;
  const sx = cam.cx - halfW, sy = cam.cy - halfH;
  ctx.drawImage(img, sx, sy, sw, sh, SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);

  // Privacy: blur the whole screen for the entire backup step (reveal, scroll and verify),
  // from the 'backup' marker until the home screen appears. Rect tracking missed scrolled frames.
  const ev = PLAN.events[s.phase];
  const bStart = ev.find(m => m.type === 'mark' && m.name === 'backup')?.t;
  const bEnd = ev.find(m => m.type === 'mark' && m.name === 'home')?.t;
  if (bStart !== undefined && ms >= bStart - 150 && ms < (bEnd ?? Infinity) + 400) {
    ctx.save();
    rr(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h, 34); ctx.clip();
    ctx.filter = 'blur(34px)';
    ctx.drawImage(img, sx, sy, sw, sh, SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
    ctx.filter = 'none';
    ctx.fillStyle = 'rgba(12,11,9,.6)'; ctx.fillRect(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
    ctx.restore();
    const label = 'Recovery phrase hidden';
    ctx.save(); ctx.font = `600 40px ${BODY}`; const lw = ctx.measureText(label).width; ctx.restore();
    const lx = SCREEN.x + SCREEN.w / 2, ly = SCREEN.y + SCREEN.h * .42;
    ctx.fillStyle = K.ink; rr(lx - lw / 2 - 30, ly - 40, lw + 60, 74, 37); ctx.fill();
    ctx.strokeStyle = K.silver; ctx.lineWidth = 2; ctx.stroke();
    text(label, lx, ly + 12, { size: 40, align: 'center', color: K.paper });
  }

  // Tap indicators
  for (const e of ev) {
    if (e.type !== 'tap') continue;
    const age = ms - e.t;
    if (age < -150 || age > 900) continue;
    const k = clamp((age + 150) / 1050);
    const [x, y] = mapPt(cam, e.x, e.y);
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = K.paper; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(x, y, 26 + 60 * easeOut(k), 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(245,240,230,.35)'; ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(200,204,212,.5)'; ctx.lineWidth = 2; rr(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h, 34); ctx.stroke();

  // Speed badge when footage plays faster than real time
  const speed = (s.b - s.a) / 1000 / s.dur;
  if (speed > 1.6 && s.id !== 'hook') {
    const lbl = `${Math.round(speed)}× speed`;
    ctx.save(); ctx.font = `600 26px ${BODY}`; const w = ctx.measureText(lbl).width; ctx.restore();
    ctx.fillStyle = 'rgba(12,11,9,.8)'; rr(SCREEN.x + SCREEN.w - w - 54, SCREEN.y + 22, w + 32, 46, 23); ctx.fill();
    text(lbl, SCREEN.x + SCREEN.w - 38, SCREEN.y + 54, { size: 26, align: 'right', color: K.silver });
  }
}

function header(t, s) {
  logo(92, 110, 64);
  const zw = text('ZecHub', 138, 122, { font: DISPLAY, weight: 700, size: 34 });
  text('guide', 138 + zw + 12, 122, { size: 30, weight: 400, color: K.silver });
  if (s.step) {
    const chip = s.step.toUpperCase();
    ctx.save(); ctx.font = `700 26px ${DISPLAY}`; ctx.letterSpacing = '2px'; const w = ctx.measureText(chip).width; ctx.restore();
    ctx.strokeStyle = K.silver; ctx.lineWidth = 2; rr(W - 92 - w - 40, 84, w + 40, 52, 26); ctx.stroke();
    text(chip, W - 92 - 20, 119, { font: DISPLAY, weight: 700, size: 26, align: 'right', spacing: 2 });
  }
}

// Burned-in captions: the spoken line in chunks timed to the voice.
function captions(t, s) {
  const words = s.say.split(' ');
  const chunks = []; let cur = [];
  for (const w of words) { cur.push(w); if (cur.join(' ').length > 24 || /[.,;]$/.test(w) && cur.join(' ').length > 12) { chunks.push(cur.join(' ')); cur = []; } }
  if (cur.length) chunks.push(cur.join(' '));
  const total = chunks.reduce((n, c) => n + c.length, 0);
  let acc = s.start + s.speechStart, idx = -1;
  for (let i = 0; i < chunks.length; i++) {
    const d = s.speechDur * chunks[i].length / total;
    if (t >= acc && t < acc + d) { idx = i; break; }
    acc += d;
  }
  if (t >= s.start + s.speechStart + s.speechDur) idx = chunks.length - 1;
  if (idx < 0) return;
  const line = chunks[idx];
  let size = 58;
  ctx.save(); ctx.font = `700 ${size}px ${BODY}`; let w = ctx.measureText(line).width; ctx.restore();
  if (w > 940) { size = Math.floor(size * 940 / w); w = 940; }
  const y = 1828;
  ctx.fillStyle = K.paper; rr(W / 2 - w / 2 - 30, y - size - 12, w + 60, size + 38, 18); ctx.fill();
  text(line, W / 2, y, { size, weight: 700, align: 'center', color: K.ink });
}

function titleCard(t) {
  const k = 1 - seg(t, 2.6, 3.2);
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k * .82; ctx.fillStyle = K.ink; ctx.fillRect(SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h); ctx.restore();
  const a = easeOut(seg(t, .1, .7)) * k;
  text('NOZYWALLET', W / 2, 760, { font: DISPLAY, weight: 700, size: 40, align: 'center', color: K.silver, spacing: 8, alpha: a });
  text('Install, receive,', W / 2, 880 + (1 - a) * 20, { font: DISPLAY, weight: 800, size: 84, align: 'center', alpha: a });
  text('and send', W / 2, 980 + (1 - a) * 20, { font: DISPLAY, weight: 800, size: 84, align: 'center', alpha: a });
  text('Install  →  Receive  →  Send', W / 2, 1090, { size: 40, weight: 500, align: 'center', color: K.silver, alpha: a });
}

function endCard(t) {
  const k = easeOut(seg(t, PLAN.total - 5, PLAN.total - 4.2));
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = K.ink; ctx.fillRect(0, 0, W, H); ctx.restore();
  logo(W / 2, 640, 220 * (0.9 + .1 * k), k);
  text('NozyWallet', W / 2, 900, { font: DISPLAY, weight: 800, size: 84, align: 'center', alpha: k });
  text('Shielded-only Zcash wallet · open source', W / 2, 980, { size: 40, weight: 500, align: 'center', color: K.silver, alpha: k });
  ctx.save(); ctx.globalAlpha = k; ctx.strokeStyle = K.silver; ctx.lineWidth = 2; rr(150, 1070, 780, 190, 24); ctx.stroke(); ctx.restore();
  text('github.com/LEONINE-DAO/Nozy-wallet', W / 2, 1148, { size: 40, weight: 600, align: 'center', alpha: k });
  text('Extension v2.0.3  ·  companion v2.4.8', W / 2, 1210, { size: 34, weight: 400, align: 'center', color: K.silver, alpha: k });
  text('Made with ZecHub  ·  zechub.wiki', W / 2, 1400, { font: DISPLAY, weight: 700, size: 36, align: 'center', alpha: k });
  text('Throwaway demo wallet, unfunded: no transaction was broadcast.', W / 2, 1720, { size: 30, weight: 400, align: 'center', color: K.silver, alpha: k });
}

async function render(t) {
  const s = segAt(t);
  ctx.fillStyle = K.ink; ctx.fillRect(0, 0, W, H);
  header(t, s);
  await drawScreen(s, t);
  if (s.id === 'hook') titleCard(t - s.start);
  captions(t, s);
  endCard(t);
}

window.__seek = async t => { await render(t); return cv.toDataURL('image/jpeg', .9); };
window.__ready = (async () => {
  await Promise.all([
    document.fonts.load(`800 40px Syne`), document.fonts.load(`700 40px Syne`),
    document.fonts.load(`700 40px Outfit`), document.fonts.load(`600 40px Outfit`), document.fonts.load(`500 40px Outfit`), document.fonts.load(`400 40px Outfit`),
  ]);
  return true;
})();
</script>
</body>
</html>
